<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img"
     aria-label="A la izquierda, una tarjeta con tres personas, cada una con sus fichas de indicadores, y tres flechas que las llevan a la tarjeta del centro. En el centro, una tarjeta llena de fichas y, encima, un montón de fichas apiladas que la desbordan; debajo, sobre una etiqueta amarilla, la palabra Proliferación. A la derecha, una flecha punteada sale del montón hacia una bandeja de contorno punteado que está vacía. Debajo de los extremos, los rótulos: cada actor consultado propone, y ninguna comisión quiere descartar.">
  <!-- Ilustración de marca · Universidad Andina Virtual · gov-u03-dcc-v2 · tema 1 (cuerpo, subtema
       1.1, bajo el subtítulo «¿Qué es la proliferación?» y antes del párrafo «En la construcción de
       sistemas de indicadores es frecuente encontrar una falla que agota a los equipos: la
       proliferación…»)
       Concepto (DI, propuesta, ese párrafo): «Ocurre porque cada actor consultado propone los
       indicadores que le interesan y porque ninguna comisión quiere descartar la propuesta de un
       colega.» Todos añaden, nadie quita: la batería desborda su tarjeta.
       Rótulos: «Proliferación» (el texto de la infografía 02_inf en el Word del autor y el término
       del párrafo) y dos fragmentos literales de la oración. Guion en insumos/ILUSTRACIONES.md.
       Una ficha = un indicador propuesto: la línea azul es su nombre. No lleva dato ni deja de
       llevarlo: aquí no se dibuja cuáles están calculados.
       Las cantidades no significan nada: el DI no dice cuántos actores hay y la batería es «de
       cincuenta o sesenta». Tres personas es el mínimo para leer «cada actor»; el montón se dibuja
       encimado para que no se cuente, y no suma ninguna de las cantidades del DI.
       Contorno punteado = lo que falta (el mismo código de ilustracion-dos-anos-despues.svg): la
       salida que nadie usa y la bandeja de lo descartado, vacía.
       Único amarillo: la etiqueta del término, «Proliferación» (texto en abismo sobre sol). -->
  <defs>
    <linearGradient id="ilu-proliferacion-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E6F3FA"/>
      <stop offset="55%"  stop-color="#E8EDF5"/>
      <stop offset="100%" stop-color="#F5F8FB"/>
    </linearGradient>
    <filter id="ilu-proliferacion-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#132B41" flood-opacity="0.16"/>
    </filter>
  </defs>

