<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img"
     aria-label="Dos tarjetas con fichas de indicadores. En la de la izquierda, más pequeña, hay ocho fichas y las ocho tienen su dato; en su esquina, una marca de verificación amarilla. En la de la derecha, más grande, hay treinta fichas: cinco tienen su dato y las otras veinticinco son solo un contorno punteado con el nombre, sin dato. Debajo de cada tarjeta, los rótulos: ocho indicadores calculados y verificables, y treinta declarados y cinco disponibles.">
  <!-- Ilustración de marca · Universidad Andina Virtual · gov-u03-dcc-v2 · tema 1 (cuerpo, cierre de
       1.1, entre el párrafo «Al aplicar este conocimiento en su institución…» y el párrafo «Para
       verificar que su sistema de indicadores está listo…»)
       Concepto (DI, propuesta, párrafo «Al aplicar este conocimiento en su institución…»): «Es
       preferible una evaluación con ocho indicadores calculados y verificables que una con treinta
       declarados y cinco disponibles.» Las cantidades son las del DI y se dibujan exactas: ocho
       fichas con dato a la izquierda; treinta fichas a la derecha, cinco con dato. Rótulos:
       fragmentos literales de esa oración. Guion en insumos/ILUSTRACIONES.md.
       Una ficha = un indicador: la línea corta es su nombre (declarado) y la píldora, su dato. Todas
       las píldoras miden lo mismo: no hay valores ni escala, solo «tiene dato» o «no lo tiene».
       Contorno punteado = lo que falta (el mismo código de ilustracion-dos-anos-despues.svg).
       La posición de las cinco fichas con dato no significa nada: el DI no dice cuáles son.
       Único amarillo: la marca de verificación de la tarjeta de los ocho («Es preferible»,
       «verificables»). -->
  <defs>
    <linearGradient id="ilu-ocho-calculados-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E6F3FA"/>
      <stop offset="55%"  stop-color="#E8EDF5"/>
      <stop offset="100%" stop-color="#F5F8FB"/>
    </linearGradient>
    <filter id="ilu-ocho-calculados-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#132B41" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="18" fill="url(#ilu-ocho-calculados-fondo)"/>

  <!-- Las dos evaluaciones: la de ocho indicadores y la de treinta -->
